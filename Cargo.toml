[package]
name = "tengin"
version = "0.1.0"
edition = "2024"
description = "A small JavaScript engine written in Rust, designed to run in no_std + alloc environments."
license = "MIT OR Apache-2.0"
repository = "https://github.com/taisan11/Tengin"
keywords = ["javascript", "ecmascript", "engine", "interpreter", "no_std"]
categories = ["no-std", "parser-implementations", "wasm"]

[workspace]
members = ["tengin-cli", "tengin-test262"]

[dependencies]
libm = "0.2"
oxc_allocator = "0.147.0"
oxc_ast = "0.147.0"
oxc_parser = "0.147.0"
oxc_span = "0.147.0"
regex = "1"
